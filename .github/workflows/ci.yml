name: CI

# The machine gate: every PR (and every push to main) runs the full Playwright
# battery on GitHub's runners. main auto-deploys to the live kids' app
# (calm-station.vercel.app), so nothing should merge unverified — this
# workflow is what makes the repo Ringer-eligible per the darkFactory
# routing rule (CI-gated repos only).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start app server
        run: |
          npx http-server src -p 8080 -s &
          curl -s --retry 20 --retry-delay 1 --retry-connrefused -o /dev/null http://localhost:8080
          echo "server up"

      - name: Run full test battery (every tests/*-test.mjs)
        # Discovered by glob, not enumerated: the old hardcoded list silently
        # dropped phase11 (invert mode) out of the gate for two PRs. A new
        # suite is now gating the moment the file lands. Each suite is its own
        # node process + browser, so run order doesn't matter (state coupling
        # is within a file, by design — see soundscape-test.mjs header).
        run: |
          shopt -s nullglob
          tests=(tests/*-test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no test suites matched tests/*-test.mjs — the gate is empty"
            exit 1
          fi
          echo "discovered ${#tests[@]} suites: ${tests[*]}"
          fail=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! node "$t"; then
              echo "::error::$t FAILED"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
